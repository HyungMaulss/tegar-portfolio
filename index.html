    /* Splash: painted before any JS loads; src/main.jsx completes the bar and removes it. */
    #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f4f6ff; color: #1a1b3a; transition: opacity .45s ease .35s, visibility 0s .8s; }
    [data-theme="dark"] #splash { background: #12132b; color: #f4f6ff; }
    #splash .splash__box { display: grid; justify-items: center; gap: 18px; font-family: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif; }
    #splash svg { width: 92px; height: 57px; fill: currentColor; animation: splash-in .7s cubic-bezier(.22,1,.36,1) both; }
    #splash .splash__name { font-size: 22px; font-weight: 800; letter-spacing: -.02em; animation: splash-in .7s cubic-bezier(.22,1,.36,1) .1s both; }
    #splash .splash__role { margin-top: -12px; font: 600 14px "Plus Jakarta Sans", system-ui, sans-serif; opacity: .72; animation: splash-in .7s cubic-bezier(.22,1,.36,1) .15s both; }
    #splash .splash__bar { width: 200px; height: 6px; border-radius: 3px; overflow: hidden; background: rgba(127,129,170,.25); }
    #splash .splash__bar span { display: block; height: 100%; width: 85%; border-radius: 3px; background: #ffc83d; transform-origin: left; animation: splash-load 1.6s cubic-bezier(.22,1,.36,1) both; transition: width .3s ease; }
    #splash.is-done .splash__bar span { width: 100%; }
    #splash.is-done { opacity: 0; visibility: hidden; }
    @keyframes splash-in { from { opacity: 0; transform: translateY(10px); } }
    @keyframes splash-load { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { #splash, #splash * { animation: none !important; transition: none !important; } }
  </style>
