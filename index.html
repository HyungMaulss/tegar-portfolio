<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Tegar Maulana, Quality Assurance Engineer in Jakarta. Manual, API, performance and end-to-end automation testing." />
  <meta name="theme-color" content="#f4f6ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12132b" media="(prefers-color-scheme: dark)" />
  <title>Tegar Maulana | QA Engineer</title>
  <!-- Set theme before first paint so there is no light/dark flash -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
